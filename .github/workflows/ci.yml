name: CI / Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - ".millennium/Dist/index.js"
      - "plugin.json"
  workflow_dispatch:

concurrency:
  group: nativegamelink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify clean build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for portable browser tests
        run: npx playwright install --with-deps chromium

      - name: Configure portable browser tests
        run: |
          browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          echo "CLOUD_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          echo "ACHIEVEMENT_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"

      - name: Run full verification and production build
        env:
          NGL_INSTALLED_STEAM_CHECKS: unavailable
        run: npm run verify

      - name: Prepare clean/source release staging
        run: npm run package:prepare

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload compiled build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: NativeGameLinkForSteam-build-${{ github.sha }}
          path: |
            plugin.json
            .millennium/Dist/index.js
          if-no-files-found: error
          retention-days: 14

  sync-generated:
    name: Sync generated frontend on main
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild generated files
        run: npm run build

      - name: Commit generated manifest and frontend bundle when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plugin.json .millennium/Dist/index.js
          if git diff --cached --quiet; then
            echo "Generated files are already synchronized."
            exit 0
          fi
          git commit -m "build: sync generated Millennium bundle [skip ci]"
          git push origin HEAD:main
